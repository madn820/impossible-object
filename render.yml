name: Render Impossible Object
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Render 5-second 720p preview first (recommended)'
        type: boolean
        default: true
      quality_blur:
        description: '3-sample motion blur (very slow)'
        type: boolean
        default: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: Render
        run: |
          if [ "${{ inputs.preview_only }}" = "true" ]; then
            xvfb-run -a npm run preview
          elif [ "${{ inputs.quality_blur }}" = "true" ]; then
            xvfb-run -a node scripts/render.js --quality
          else
            xvfb-run -a npm run render
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impossible-object-video
          path: |
            output/*.mp4
            output/*.wav
          if-no-files-found: warn
          retention-days: 7
